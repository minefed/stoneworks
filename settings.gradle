pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.minecraftforge.net/" }
    }
}

// Omit unused Loom projects when building only one loader with configure-on-demand.
def minefedLoaders = providers.gradleProperty("minefedLoaders")
        .getOrElse("Fabric,NeoForge,Forge").split(",").collect { it.trim() }
if (!minefedLoaders || minefedLoaders.any { !(it in ["Fabric", "NeoForge", "Forge"]) }) {
    throw new GradleException("minefedLoaders must list Fabric, NeoForge or Forge, separated by commas")
}
include "Common"
minefedLoaders.each { include it }

apply from: "https://raw.githubusercontent.com/Fuzss/modresources/e6311c7c40cfb0fe4240f22fd80efbbe9c554585/gradle/v2/settings.gradle"
